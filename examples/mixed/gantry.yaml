# One pod, three engines sharing its namespaces. nginx runs under Docker,
# the checker under Podman and the reporter under kiri (patched, see
# contrib/kiri). They share one hostname and talk over loopback because
# they live in one pod. The others start once nginx answers.
name: mixed

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: ${LAN_PARENT:-vlan4}
      mode: bridge
    ipam:
      config:
        - subnet: 192.0.2.216/29
          gateway: 192.0.2.222

pods:
  app:
    networks:
      lan:
        ipv4_address: 192.0.2.217
    firewall:
      input:
        - { proto: tcp, port: 80, from: [198.51.100.0/24, network:lan] }

services:
  web:
    image: nginx:alpine
    pod: app
    runtime: docker
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      start_period: 5s
      start_interval: 500ms
  checker:
    image: alpine:3
    pod: app
    runtime: podman
    depends_on: { web: { condition: service_healthy } }
    command: ["sh", "-c", "while true; do wget -qO- http://localhost/ | grep -o 'Welcome to nginx' ; sleep 15; done"]
  reporter:
    image: alpine:3
    pod: app
    runtime: kiri
    depends_on: { web: { condition: service_healthy } }
    command: ["sh", "-c", "while true; do wget -qO- http://web/ >/dev/null && echo kiri sees nginx on loopback; sleep 15; done"]

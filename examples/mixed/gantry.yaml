# One pod, two engines sharing its namespaces. nginx and the checker run
# under Docker and the reporter under kiri (patched, see contrib/kiri).
# nginx is restarted if its healthcheck keeps failing. They share one hostname and talk over loopback because
# they live in one pod. The others start once nginx answers. The firewall
# rule lets the lab and the pod's own subnet reach port 80; the default
# policy rejects every other port from the subnet.
name: mixed

pods:
  app:
    network:
      - parent: ${LAN_PARENT:-vlan4}
        address: 192.0.2.217/29
        gateway: 192.0.2.222
    firewall:
      input:
        - { proto: tcp, port: 80, from: [198.51.100.0/24, subnet] }

services:
  web:
    image: nginx:alpine
    pod: app
    runtime: docker
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      start_period: 5s
      start_interval: 500ms
    health_on_failure: restart
  checker:
    image: alpine:3
    pod: app
    runtime: docker
    depends_on: { web: { condition: service_healthy } }
    command: ["sh", "-c", "while true; do wget -qO- http://localhost/ | grep -o 'Welcome to nginx' ; sleep 15; done"]
  reporter:
    image: alpine:3
    pod: app
    runtime: kiri
    depends_on: { web: { condition: service_healthy } }
    command: ["sh", "-c", "while true; do wget -qO- http://web/ >/dev/null && echo kiri sees nginx on loopback; sleep 15; done"]

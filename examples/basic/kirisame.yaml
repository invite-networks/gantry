# Two pods on the LAN through macvlan. Adjust the network section to your
# environment. Values below match the kirisame test host.
name: basic
runtime: ${KIRISAME_RUNTIME:-docker}

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: ${LAN_PARENT:-vlan4}
      mode: bridge
    ipam:
      config:
        - subnet: 192.0.2.216/29
          gateway: 192.0.2.222

pods:
  web:
    hostname: web
    networks:
      lan:
        ipv4_address: 192.0.2.218
    firewall:
      log_dropped: true
      input:
        - { proto: tcp, port: 22, from: 198.51.100.0/24, comment: "ssh from the lab" }
      output:
        - { to: 192.168.0.0/16, action: reject }

  data:
    networks:
      lan:
        ipv4_address: 192.0.2.219
    firewall:
      input:
        - { proto: tcp, port: 6379, from: pod:web }

services:
  nginx:
    image: nginx:alpine
    pod: web
    ports: ["80"]
    depends_on:
      redis: { condition: service_healthy }

  sidecar:
    image: alpine:3
    pod: web
    command: ["sh", "-c", "while true; do wget -qO- http://127.0.0.1/ >/dev/null && echo nginx ok over loopback; sleep 10; done"]

  redis:
    image: redis:7-alpine
    pod: data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 10

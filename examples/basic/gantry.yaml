# Two pods on the LAN through macvlan. Adjust parent, addresses and gateway
# to your environment.
name: basic
runtime: ${GANTRY_RUNTIME:-docker}

pods:
  # Default firewall: any ICMP, nothing from the local subnet, everything
  # routed is left to the upstream firewall. ports: below opens 80 to all.
  web:
    hostname: web
    network:
      - parent: ${LAN_PARENT:-vlan4}
        address: 192.0.2.218/29
        gateway: 192.0.2.222          # not the first host, so it is set
    firewall:
      log_dropped: true
      output:
        - { to: 192.168.0.0/16, action: reject }

  # Locked down: only the web pod may reach redis.
  data:
    network:
      - parent: ${LAN_PARENT:-vlan4}
        address: 192.0.2.219/29
        gateway: 192.0.2.222
    firewall:
      policy: { input: drop }
      input:
        - { proto: tcp, port: 6379, from: pod:web }

services:
  nginx:
    image: nginx:alpine
    pod: web
    ports: ["80"]
    depends_on:
      redis: { condition: service_healthy }

  sidecar:
    image: alpine:3
    pod: web
    command: ["sh", "-c", "while true; do wget -qO- http://127.0.0.1/ >/dev/null && echo nginx ok over loopback; sleep 10; done"]

  redis:
    image: redis:7-alpine
    pod: data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 10

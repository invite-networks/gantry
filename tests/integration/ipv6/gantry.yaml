# Three pods with static IPv4 and IPv6 addresses on the lab bridge. Pod a
# accepts port 7000 from pod b, over either family; the default policy
# rejects the rest of the subnet, so c is refused.
name: v6
runtime: ${GANTRY_RUNTIME:-docker}
pods:
  a:
    network: [{ parent: gtdhcp0, address: 10.99.0.31/24, address6: "fd99::31/64" }]
    firewall:
      input:
        - { proto: tcp, port: 7000, from: [pod:b] }
  b:
    network: [{ parent: gtdhcp0, address: 10.99.0.32/24, address6: "fd99::32/64" }]
  c:
    network: [{ parent: gtdhcp0, address: 10.99.0.33/24, address6: "fd99::33/64" }]
services:
  sa: { image: alpine:3, pod: a, command: ["sh", "-c", "while true; do echo v6-ok | nc -l -p 7000; done"] }
  sb: { image: alpine:3, pod: b, command: ["sleep", "infinity"] }
  sc: { image: alpine:3, pod: c, command: ["sleep", "infinity"] }

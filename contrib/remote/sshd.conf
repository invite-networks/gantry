# Installed by the gantry package as /etc/ssh/sshd_config.d/gantry.conf.
# The gantry-remote account logs in with a key from
# /etc/gantry/remote/authorized_keys (root owned) and can only run
# gantry-ssh. Add one key per caller, for example:
#   from="10.0.0.0/24" ssh-ed25519 AAAA... ci@example
Match User gantry-remote
	AuthorizedKeysFile /etc/gantry/remote/authorized_keys
	AuthenticationMethods publickey
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	ForceCommand /usr/libexec/gantry/gantry-ssh
	DisableForwarding yes
	PermitTTY no
	PermitUserRC no

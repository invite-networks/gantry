name: release

# A pushed tag vX.Y.Z builds the .deb files, publishes a GitHub Release with
# build provenance, and adds the packages to the INVITE Networks apt
# repository. Run it by hand to build the packages without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low enough for
          # Debian 12 and Ubuntu 22.04 hosts.
          - { arch: amd64, runner: ubuntu-22.04 }
          # arm64 is off until it is needed; re-enable with this line:
          # - { arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gantry") | .version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
      - run: cargo install cargo-deb --locked
      - run: scripts/package.sh
      - name: Smoke test
        run: |
          sudo apt-get install -y ./target/debian/*.deb
          gantry version
          man -w gantry
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.deb > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.deb
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  apt:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          repository: invite-networks/apt
          ssh-key: ${{ secrets.APT_DEPLOY_KEY }}
          path: apt
      - name: Add the packages to the apt repository
        run: |
          dest=apt/pool/main/g/gantry
          mkdir -p "$dest"
          cp dist/*.deb "$dest/"
          cd apt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool
          git commit -m "gantry $GITHUB_REF_NAME"
          git push

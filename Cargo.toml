[package]
name = "gantry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Pod-first container orchestrator using the Compose format, with Docker, Podman and kiri backends"
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gantry"
path = "src/bin/gantry.rs"

[[bin]]
name = "gantry-oci"
path = "src/bin/gantry-oci.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
dhcproto = "0.15"
indexmap = { version = "2", features = ["serde"] }
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
nix = { version = "0.32", features = ["sched", "mount", "fs", "process", "signal", "hostname", "user", "socket", "net", "uio", "term", "ioctl"] }
futures-util = "0.3"
rtnetlink = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
shell-words = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

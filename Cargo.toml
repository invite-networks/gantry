[package]
name = "gantry"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Pod-first container orchestrator using the Compose format, with Docker and kiri backends and self-healing"
readme = "README.md"
repository = "https://github.com/invite-networks/gantry"
keywords = ["containers", "pods", "compose", "macvlan", "nftables"]
categories = ["command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "gantry"
path = "src/bin/gantry.rs"
required-features = ["runtime"]

[[bin]]
name = "gantry-oci"
path = "src/bin/gantry-oci.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
# Everything that runs pods: namespaces, netlink, engines, the CLI. Without
# it the library is the compose loader and checker only, which builds on
# macOS for callers that validate project files off the host.
runtime = [
    "dep:clap", "dep:dhcproto", "dep:futures-util", "dep:rtnetlink", "dep:tokio",
    "dep:tokio-util", "dep:tracing-subscriber", "dep:bollard", "dep:base64",
    "dep:clap_complete", "dep:clap_mangen", "dep:libc",
]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"], optional = true }
dhcproto = { version = "0.15", optional = true }
indexmap = { version = "2", features = ["serde"] }
ipnet = { version = "2", features = ["serde"] }
libc = { version = "0.2", optional = true }
nix = { version = "0.32", features = ["sched", "mount", "fs", "process", "signal", "hostname", "user", "socket", "net", "uio", "term", "ioctl"] }
futures-util = { version = "0.3", optional = true }
rtnetlink = { version = "0.24", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["full"], optional = true }
tokio-util = { version = "0.7", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
bollard = { version = "0.21", default-features = false, features = ["pipe"], optional = true }
base64 = { version = "0.23", optional = true }
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.3", optional = true }
serde_norway = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[package.metadata.deb]
maintainer = "INVITE Networks"
section = "admin"
priority = "optional"
depends = "$auto, nftables, rsync"
recommends = "docker-ce | docker.io, sudo, openssh-server"
maintainer-scripts = "debian/"
extended-description = """\
Gantry runs Compose projects as pods. It creates each pod's namespaces \
itself, puts the pod on the LAN with macvlan or ipvlan, applies an \
nftables firewall inside the pod, and starts the pod's containers with \
Docker or kiri. A small watcher restarts services whose healthchecks keep \
failing."""
assets = [
    ["target/release/gantry", "usr/bin/", "755"],
    ["target/release/gantry-oci", "usr/bin/", "755"],
    ["contrib/systemd/gantry-boot.service", "lib/systemd/system/", "644"],
    ["contrib/systemd/gantry-supervise.service", "lib/systemd/system/", "644"],
    ["contrib/project-dirs", "etc/gantry/project-dirs", "644"],
    ["contrib/remote/gantry-run", "usr/libexec/gantry/", "755"],
    ["contrib/remote/gantry-ssh", "usr/libexec/gantry/", "755"],
    ["contrib/remote/sudoers", "etc/sudoers.d/gantry", "440"],
    ["contrib/remote/sshd.conf", "etc/ssh/sshd_config.d/gantry.conf", "644"],
    ["target/package/gantry.1", "usr/share/man/man1/", "644"],
    ["target/package/gantry.bash", "usr/share/bash-completion/completions/gantry", "644"],
    ["target/package/_gantry", "usr/share/zsh/vendor-completions/", "644"],
    ["target/package/gantry.fish", "usr/share/fish/vendor_completions.d/", "644"],
    ["README.md", "usr/share/doc/gantry/", "644"],
    ["docs/compose-spec.md", "usr/share/doc/gantry/", "644"],
    ["examples/basic/gantry.yaml", "usr/share/doc/gantry/examples/basic/", "644"],
    ["examples/mixed/gantry.yaml", "usr/share/doc/gantry/examples/mixed/", "644"],
]
